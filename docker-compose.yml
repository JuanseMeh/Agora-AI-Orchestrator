services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-orchestrator-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - agora-network

  redis:
    image: redis:7-alpine
    container_name: ai-orchestrator-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-orchestrator
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "50051:50051"
    env_file: .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      GRPC_PORT: ${GRPC_PORT}
      REDIS_URL: ${REDIS_URL}
      SUGGESTION_TTL_HOURS: ${SUGGESTION_TTL_HOURS}
      WORKSPACE_SERVICE_URL: ${WORKSPACE_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      RUST_LOG: ${RUST_LOG}
      QDRANT_URL: ${QDRANT_URL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RAG_ENABLED: ${RAG_ENABLED}
      RAG_TOP_K: ${RAG_TOP_K}

    networks:
      - agora-network

volumes:
  redis_data:
  qdrant_data:

networks:
  agora-network:
    external: true
    name: agora-network
