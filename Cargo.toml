[package]
name = "ai"
version = "0.1.1"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC (API layer)
tonic = "0.14.5"
prost = "0.14.3"

# REST client (for Workspace Service + Gemini)
reqwest = { version = "0.13.2", features = ["json"], default-features = false }

# Serialization — used throughout models, Gemini payloads, JSONB writes
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUIDs for execution plan / result IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0.18"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.15.22"

# Async traits (needed for Tool interface)
async-trait = "0.1"

[build-dependencies]
# Only needed when you add .proto files for gRPC
tonic-prost-build = "0.14.2"   # replaces tonic-build for compilation