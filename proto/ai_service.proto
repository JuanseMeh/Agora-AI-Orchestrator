syntax = "proto3";

package ai;

service AiService {
  rpc SuggestAssignment (SuggestAssignmentRequest) returns (SuggestAssignmentResponse);
  rpc ApproveSuggestion (ApproveSuggestionRequest) returns (ApproveSuggestionResponse);
  rpc GradeAssignment (GradeAssignmentRequest) returns (GradeAssignmentResponse);
  rpc GeneratePerformanceReport (GeneratePerformanceReportRequest) returns (GeneratePerformanceReportResponse);
}

message SuggestAssignmentRequest {
  int32 workspace_id  = 1;
  int32 assignment_id = 2;
  string requester_user_id = 3;
  repeated int32 submission_ids = 4;
  repeated string user_ids = 5;
  bool include_already_graded = 6;
}

message SuggestionStats {
  double average_score = 1;
  double max_score = 2;
  int32 graded_submissions = 3;
}

message SuggestAssignmentResponse {
  string suggestion_id = 1;
  repeated GradingResult results = 2;
  SuggestionStats stats = 3;
}

message ApproveSuggestionRequest {
  string suggestion_id = 1;
}

message ApproveSuggestionResponse {
  string suggestion_id = 1;
  repeated GradingResult results = 2;
}

message GradeAssignmentRequest {
  int32 workspace_id  = 1;
  int32 assignment_id = 2;
  repeated int32 submission_ids = 3;
  repeated string user_ids = 4;
  bool include_already_graded = 5;
}

message CriterionResult {
  string criterion_id   = 1;
  string criterion_name = 2;
  double score          = 3;
  double max_score      = 4;
  string feedback       = 5;
  string matched_level  = 6;
}

message GradingResult {
  string result_id         = 1;
  int32  submission_id     = 2;
  double total_score       = 3;
  double max_score         = 4;
  string feedback_summary  = 5;
  string grading_model     = 6;
  string evaluated_at      = 7;
  repeated CriterionResult criteria_results = 8;
}

message GradeAssignmentResponse {
  repeated GradingResult results = 1;
}

message GeneratePerformanceReportRequest {
  int32 workspace_id = 1;
  optional int32 assignment_id = 2;
}

message AssignmentPerformance {
  int32 assignment_id = 1;
  string assignment_name = 2;
  int32 total_submissions = 3;
  int32 graded_submissions = 4;
  int32 pending_submissions = 5;
  double average_score = 6;
  double max_score = 7;
  int32 failed_submissions = 8;
  double failure_rate = 9;
}

message StudentPerformance {
  string user_id = 1;
  int32 total_submissions = 2;
  int32 graded_submissions = 3;
  int32 pending_submissions = 4;
  double average_score = 5;
}

message GeneratePerformanceReportResponse {
  int32 workspace_id = 1;
  optional int32 assignment_id = 2;
  int32 total_assignments = 3;
  int32 total_submissions = 4;
  int32 graded_submissions = 5;
  int32 pending_submissions = 6;
  double average_score = 7;
  string ai_analysis = 8;
  repeated AssignmentPerformance assignments = 9;
  repeated StudentPerformance students = 10;
}
